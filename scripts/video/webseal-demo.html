<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebSeal demo video</title>
<!--
  The 2-minute WebSeal video, drawn on a canvas by code. Intro and outro are animated titles with
  music; the middle is the recorded demo (scripts/video/capture.mjs): real footage of the wagmi app
  with WebSeal, the real CLI output typed out, the real MetaMask screenshots.
  drawFrame(t) depends only on t (images are awaited first), so any frame renders identically.
  renderAudio() builds the soundtrack from the same timeline, so sound lands on the picture.
  Design: video-assets/colors.md (dark), fonts.md (Segoe UI, Cascadia Mono).
-->
<style>html, body { margin: 0; background: #0b0c0e; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="2560" height="1440"></canvas>
<script>
const DW = 1920, DH = 1080;                 // layout space
const CW = 2560, CH = 1440, S = CW / DW;    // output pixels
const DURATION = 120;

const C = { paper: '#0b0c0e', cell: '#15171b', ink: '#eceef2', muted: '#9aa0ab', line: '#eceef2', accent: '#5b7bff', ok: '#1a8f3c', bad: '#b00020', hatch: '#2a2d33', amber: '#e0a400', termBg: '#0b0c0e', termBar: '#101114', okText: '#4ade80', badText: '#ff6b6b' };
const SANS = '"Segoe UI", ui-sans-serif, system-ui, sans-serif';
const MONO = '"Cascadia Mono", ui-monospace, Consolas, monospace';

/* ---------- data ---------- */
let F; // footage.json
const SHOTS = {
  icon: '/video-assets/icons/icon512.png',
  ext: '/video-assets/screenshots/wagmi-flow/05-ext-installed.png',
  popupClean: '/video-assets/footage/popup-clean.png',
  popupBad: '/video-assets/footage/popup-tampered.png',
  mmClean: '/video-assets/screenshots/metamask/mm-02-confirm-clean.png',
  mmBlocked: '/video-assets/screenshots/metamask/mm-03-tampered-no-popup.png',
  mmAttacker: '/video-assets/screenshots/metamask/mm-04-confirm-attacker.png',
};
// crops of the hand-taken MetaMask shots: no tab bar, profile icon or account address
const CROP = {
  mmPanel: { x: 1460, y: 118, w: 452, h: 893 },
  mmTo: { x: 20, y: 344, w: 396, h: 68 },            // inside mmPanel
  mmBanner: { x: 20, y: 110, w: 1862, h: 113 },
  mmBlockedSend: { x: 707, y: 763, w: 980, h: 152 },
  extCard: { x: 1512, y: 290, w: 798, h: 320 },      // the WebSeal card on chrome://extensions (2x)
  extToggle: { x: 2244, y: 561 },
};
const IMG = {};
const cache = new Map(); // footage frames, loaded on demand
function load(src) {
  if (cache.has(src)) return cache.get(src);
  const p = new Promise((res, rej) => { const i = new Image(); i.onload = () => i.decode().then(() => res(i), () => res(i)); i.onerror = () => rej(new Error('missing ' + src)); i.src = src; });
  cache.set(src, p);
  if (cache.size > 60) cache.delete(cache.keys().next().value);
  return p;
}
window.ready = (async () => {
  F = await (await fetch('/video-assets/footage/footage.json')).json();
  await Promise.all(Object.entries(SHOTS).map(async ([k, s]) => (IMG[k] = await load(s))));
  await Promise.all([document.fonts.load(`800 100px "Segoe UI"`), document.fonts.load(`400 30px "Segoe UI"`), document.fonts.load(`600 22px "Cascadia Mono"`), document.fonts.load(`400 22px "Cascadia Mono"`)]);
  build();
})();

/* ---------- helpers ---------- */
const cv = document.getElementById('c');
const g = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const inOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const backOut = (x) => { x = clamp(x); const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const appear = (lt, at, d = 0.45) => easeOut((lt - at) / d);
const swap = (lt, at, d = 0.5) => [1 - inOut((lt - at) / (d / 2)), inOut((lt - at - d / 2) / (d / 2))];
const lerp = (a, b, k) => a + (b - a) * k;
function withAlpha(a, fn) { if (a <= 0.002) return; g.save(); g.globalAlpha *= a; fn(); g.restore(); }
const rise = (a, px = 18) => (1 - a) * px;
const font = (size, weight = 400, fam = SANS) => `${weight} ${size}px ${fam}`;
function text(s, x, y, { size = 32, weight = 400, family = SANS, color = C.ink, align = 'left', spacing = 0, maxW } = {}) {
  g.font = font(size, weight, family); g.letterSpacing = spacing + 'px';
  if (maxW) { let sz = size; while (g.measureText(s).width > maxW && sz > 12) g.font = font(--sz, weight, family); }
  g.fillStyle = color; g.textAlign = align; g.textBaseline = 'alphabetic'; g.fillText(s, x, y); g.letterSpacing = '0px';
}
function wrap(s, x, y, maxW, lineH, o) {
  g.font = font(o.size, o.weight ?? 400, o.family ?? SANS);
  let line = '', yy = y;
  for (const w of s.split(' ')) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { text(line, x, yy, o); line = w; yy += lineH; } else line = t; }
  if (line) text(line, x, yy, o);
}
const kicker = (s, x, y, color = C.muted, size = 22) => text(s.toUpperCase(), x, y, { size, weight: 600, family: MONO, color, spacing: 3 });
const rule = (x, y, w, color = C.line, h = 2) => { g.fillStyle = color; g.fillRect(x, y, w, h); };
function box(x, y, w, h, { fill = C.cell, stroke = C.line, lw = 2 } = {}) {
  if (fill) { g.fillStyle = fill; g.fillRect(x, y, w, h); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.strokeRect(x + lw / 2, y + lw / 2, w - lw, h - lw); }
}
function img(im, x, y, w, h, crop) {
  const c = crop ?? { x: 0, y: 0, w: im.naturalWidth, h: im.naturalHeight };
  g.drawImage(im, c.x, c.y, c.w, c.h, x, y, w, h);
}
/** An image (or crop) contained in a box, in a 2px frame. Returns where it landed. */
function shot(im, bx, by, bw, bh, { crop, frame = true, label } = {}) {
  const c = crop ?? { x: 0, y: 0, w: im.naturalWidth, h: im.naturalHeight };
  const s = Math.min(bw / c.w, bh / c.h), w = c.w * s, h = c.h * s;
  img(im, bx, by, w, h, c);
  if (frame) { g.strokeStyle = C.line; g.lineWidth = 2; g.strokeRect(bx - 1, by - 1, w + 2, h + 2); }
  if (label) kicker(label, bx, by - 16);
  return { x: bx, y: by, w, h, s };
}
function caption(label, color, line, a = 1) {
  withAlpha(a, () => {
    rule(120, 952, 1680);
    text(label.toUpperCase(), 120, 1010, { size: 22, weight: 600, family: MONO, color, spacing: 3, maxW: 290 });
    text(line, 440, 1012, { size: 34, weight: 500, maxW: 1360 });
  });
}
/** Captions that change at given local times, each swap sequential (out, then in). */
function captions(lt, label, color, list) {
  list.forEach(([at, s], i) => {
    const next = list[i + 1]?.[0] ?? Infinity;
    const inA = i === 0 ? appear(lt, at, 0.4) : swap(lt, at)[1];
    const outA = next === Infinity ? 1 : swap(lt, next)[0];
    caption(label, color, s, Math.min(inA, outA));
  });
}
function highlightBox(x, y, w, h, color, a, pulse = 0) {
  withAlpha(a, () => { g.strokeStyle = color; g.lineWidth = 4 + pulse * 3; g.strokeRect(x - 6, y - 6, w + 12, h + 12); });
}
function cursor(x, y, press = 0) {
  g.save(); g.translate(x, y); g.scale(1.25 - press * 0.12, 1.25 - press * 0.12);
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 26); g.lineTo(7, 20); g.lineTo(12, 31); g.lineTo(17, 29); g.lineTo(12, 18); g.lineTo(21, 18); g.closePath();
  g.fillStyle = '#ffffff'; g.fill(); g.lineWidth = 2; g.strokeStyle = '#0b0c0e'; g.stroke(); g.restore();
}
function ripple(x, y, k) { if (k <= 0 || k >= 1) return; withAlpha(1 - k, () => { g.strokeStyle = C.accent; g.lineWidth = 4; g.beginPath(); g.arc(x, y, 10 + 46 * easeOut(k), 0, Math.PI * 2); g.stroke(); }); }

/* ---------- terminal: real CLI output, typed out ---------- */
const TERM = { size: 23, lineH: 33 };
const PAINT = [
  [/^(PS [^>]*>)/, C.accent],
  [/\b(VERIFIED|REPRODUCED:[^\n]*|REPRODUCED|readback ok|every served file matches the manifest)/, C.okText],
  [/^\s+(ok|same)\b/, C.okText],
  [/\b(FAILED|MISMATCH|DIFFERENT:[^\n]*|tampered|warning)\b/, C.badText],
  [/(0xbad0000000000000000000000000000000000bad)/, C.badText],
  [/(# .*)$/, C.muted],
];
function paintLine(s) { // -> [{text, color}]
  const marks = [];
  for (const [re, color] of PAINT) { const m = re.exec(s); if (m) { const i = s.indexOf(m[1], m.index); marks.push({ a: i, b: i + m[1].length, color }); } }
  marks.sort((p, q) => p.a - q.a);
  const out = []; let pos = 0;
  for (const m of marks) { if (m.a < pos) continue; if (m.a > pos) out.push({ text: s.slice(pos, m.a), color: C.ink }); out.push({ text: s.slice(m.a, m.b), color: m.color }); pos = m.b; }
  if (pos < s.length) out.push({ text: s.slice(pos), color: C.ink });
  return out;
}
/** Plans a terminal session: commands typed, then their output line by line. */
function session(items, { cols = 118 } = {}) {
  const lines = []; let t = 0;
  for (const it of items) {
    if (it.wait) { t += it.wait; continue; }
    if (it.cmd) {
      const full = 'PS Z:\\ethmumbai> ' + it.cmd;
      const typeDur = Math.min(1.7, it.cmd.length / 48);
      lines.push({ text: full, start: t, typeFrom: 17, typeDur, cmd: true });
      t += typeDur + 0.35;
    }
    if (it.note) { lines.push({ text: '# ' + it.note, start: t, spin: it.spin ?? 0 }); t += it.spin ?? 0.4; }
    for (const raw of (it.out ?? '').split('\n')) {
      for (const part of wrapCols(raw, cols)) { lines.push({ text: part, start: t }); t += it.lineDelay ?? 0.06; }
    }
    t += 0.25;
  }
  return { lines, dur: t };
}
function wrapCols(s, cols) {
  if (s.length <= cols) return [s];
  const out = [s.slice(0, cols)]; let rest = s.slice(cols);
  while (rest.length) { out.push('          ' + rest.slice(0, cols - 10)); rest = rest.slice(cols - 10); }
  return out;
}
function terminal(x, y, w, h, sess, lt, { title = 'terminal', hl = [] } = {}) {
  box(x, y, w, h, { fill: C.termBg, stroke: C.hatch });
  g.fillStyle = C.termBar; g.fillRect(x + 2, y + 2, w - 4, 40);
  text(title.toUpperCase(), x + 18, y + 29, { size: 15, weight: 600, family: SANS, color: C.muted, spacing: 1.5 });
  g.save(); g.beginPath(); g.rect(x, y + 42, w, h - 44); g.clip();
  g.font = font(TERM.size, 400, MONO);
  const cw = g.measureText('M').width;
  const visible = sess.lines.filter((l) => lt >= l.start);
  const maxLines = Math.floor((h - 70) / TERM.lineH);
  const shown = visible.slice(Math.max(0, visible.length - maxLines));
  const pos = [];
  shown.forEach((l, i) => {
    const yy = y + 80 + i * TERM.lineH;
    let s = l.text;
    if (l.cmd) s = s.slice(0, l.typeFrom + Math.floor((s.length - l.typeFrom) * clamp((lt - l.start) / l.typeDur)));
    if (l.spin && lt < l.start + l.spin) s += ' ' + '|/-\\'[Math.floor(lt * 10) % 4];
    let xx = x + 22;
    for (const seg of paintLine(s)) { g.fillStyle = seg.color; g.font = font(TERM.size, seg.color === C.ink || seg.color === C.muted ? 400 : 600, MONO); g.fillText(seg.text, xx, yy); xx += cw * seg.text.length; }
    const typing = l.cmd && lt < l.start + l.typeDur + 0.3;
    if (typing && Math.floor(lt * 3) % 2 === 0) { g.fillStyle = C.ink; g.fillRect(xx + 2, yy - 20, cw * 0.6, 26); }
    pos.push({ l, x: x + 22, y: yy, cw, s });
  });
  g.restore();
  for (const h0 of hl) { // boxes around matching text once it is on screen
    const a = appear(lt, h0.at, 0.3);
    if (a <= 0) continue;
    for (const p of pos) { const i = p.s.indexOf(h0.text); if (i >= 0) highlightBox(p.x + i * p.cw, p.y - 24, h0.text.length * p.cw, 32, h0.color ?? C.accent, a, h0.pulse ? 0.5 + 0.5 * Math.sin(lt * 8) : 0); }
  }
}

/* ---------- browser frame + footage ---------- */
const FR = { x: 120, y: 112, w: 1240 };
FR.top = 44; FR.pw = FR.w; FR.ph = FR.w / 1.6; FR.sc = FR.w / 1280;
const page2d = (bx, by) => ({ x: FR.x + bx * FR.sc, y: FR.y + FR.top + by * FR.sc });
function footageFrame(seq, ft) {
  const fr = F.seqs[seq].frames; let lo = 0, hi = fr.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (fr[mid].t <= ft * 1000) lo = mid; else hi = mid - 1; }
  return fr[lo];
}
const ev = (seq, name) => F.seqs[seq].events.find((e) => e.name === name);
const fp = (seq) => (F.seqs[seq].firstPaint ?? 0) / 1000; // first painted frame: start footage there, never on a blank tab
/** Footage playback with holds and skips: segments play footage [from,to] over [at, at+dur]. */
function ftAt(segs, lt) { let ft = segs[0].from; for (const s of segs) { if (lt < s.at) break; ft = s.from + (s.to - s.from) * clamp((lt - s.at) / s.dur); } return ft; }
function ltOf(segs, ft) { for (const s of segs) if (s.to > s.from && ft >= s.from && ft <= s.to) return s.at + ((ft - s.from) / (s.to - s.from)) * s.dur; return null; }
function browser(seq, ft, frameImg, { badge = true } = {}) {
  const fr = footageFrame(seq, ft);
  box(FR.x, FR.y, FR.w, FR.top + FR.ph, { fill: C.cell });
  // address bar
  box(FR.x + 16, FR.y + 8, 520, 28, { fill: C.paper, stroke: C.hatch });
  text('http://localhost:4174', FR.x + 30, FR.y + 28, { size: 17, family: MONO, color: C.muted });
  if (badge) {
    const bx = FR.x + FR.w - 64;
    g.drawImage(IMG.icon, bx, FR.y + 8, 28, 28);
    const b = fr.badge;
    if (b) {
      const col = b === '\u2713' ? C.ok : b === '\u2717' ? C.bad : C.amber;
      g.fillStyle = col; g.fillRect(bx + 18, FR.y + 20, 26, 20);
      text(b, bx + 31, FR.y + 36, { size: 15, weight: 700, align: 'center', color: '#fff' });
    }
  } else text('WebSeal off', FR.x + FR.w - 24, FR.y + 29, { size: 16, family: MONO, color: C.badText, align: 'right' });
  if (frameImg) g.drawImage(frameImg, FR.x, FR.y + FR.top, FR.pw, FR.ph);
  g.strokeStyle = C.line; g.lineWidth = 2; g.strokeRect(FR.x - 1, FR.y - 1, FR.w + 2, FR.top + FR.ph + 2);
  return fr;
}
/** The pointer, moving between the recorded clicks; ripple on each click. */
function pointer(seq, ft) {
  const pts = ['click-address', 'click-value', 'click-send'].map((n) => ev(seq, n)).filter(Boolean).map((e) => ({ t: e.t / 1000, ...page2d(e.box.x + e.box.width / 2, e.box.y + e.box.height / 2) }));
  if (!pts.length || ft < pts[0].t - 1.0) return;
  let prev = { t: pts[0].t - 1.0, ...page2d(900, 380) }, pos = prev;
  for (const p of pts) {
    if (ft >= p.t) { prev = p; pos = p; continue; }
    const k = inOut((ft - (p.t - 0.55)) / 0.55);
    pos = { x: lerp(prev.x, p.x, k), y: lerp(prev.y, p.y, k) }; break;
  }
  let press = 0;
  for (const p of pts) { const k = (ft - p.t) / 0.45; ripple(p.x, p.y, k); if (ft >= p.t && ft < p.t + 0.12) press = 1; }
  cursor(pos.x + 4, pos.y + 4, press);
}

/* ---------- camera (zoom into the layout, under the captions) ---------- */
function camera(keys, lt) { // keys: [[t, cx, cy, z], ...]
  let k0 = keys[0], k1 = keys[0];
  for (let i = 0; i < keys.length; i++) { if (lt >= keys[i][0]) { k0 = keys[i]; k1 = keys[i + 1] ?? keys[i]; } }
  const span = k1[0] - k0[0], k = span > 0 ? inOut((lt - k0[0]) / Math.min(span, 0.9)) : 0;
  return { cx: lerp(k0[1], k1[1], k), cy: lerp(k0[2], k1[2], k), z: lerp(k0[3], k1[3], k) };
}
function withCamera(cam, fn) { g.save(); g.translate(DW / 2, DH / 2); g.scale(cam.z, cam.z); g.translate(-cam.cx, -cam.cy); fn(); g.restore(); }
const HOME = [960, 540, 1];

/* ---------- timeline ---------- */
let SCENES = [], CUES = [];
const CH_TITLES = ['Release', 'ENSv2 key', 'Clean page', 'The attack', 'Blocked', 'Without WebSeal', 'Anyone can check'];
function chapterHeader(i, lt, sceneDur) {
  const a = appear(lt, 0, 0.4);
  withAlpha(a, () => {
    kicker(`Demo \u00b7 ${String(i + 1).padStart(2, '0')} / 07`, 120, 64, C.accent);
    text(CH_TITLES[i], 420, 66, { size: 28, weight: 700 });
    const segW = 1680 / 7;
    for (let k = 0; k < 7; k++) { g.fillStyle = k < i ? C.ink : k === i ? C.hatch : C.cell; g.fillRect(120 + k * segW + 2, 82, segW - 4, 6); }
    g.fillStyle = C.accent; g.fillRect(120 + i * segW + 2, 82, (segW - 4) * clamp(lt / sceneDur), 6);
  });
}

function build() {
  const T = F.terminal;
  const cue = (t, type, extra) => CUES.push({ t, type, ...extra });
  let t = 0;
  const add = (id, dur, draw, setup) => { const s = { id, start: t, end: t + dur, draw }; SCENES.push(s); setup?.(s); t += dur; return s; };

  /* INTRO (music) */
  add('logo', 6, (lt) => {
    // a faint ruled grid that draws itself
    g.strokeStyle = C.hatch; g.lineWidth = 2;
    for (let i = 0; i <= 8; i++) { const k = easeOut((lt + 0.6 - i * 0.06) / 0.9); g.beginPath(); g.moveTo(120 + i * 210, 120); g.lineTo(120 + i * 210, 120 + 840 * k); g.stroke(); }
    const ai = backOut((lt + 0.25) / 0.7);
    withAlpha(clamp((lt + 0.3) / 0.4), () => { const s = 150 * ai; g.drawImage(IMG.icon, 195 - s / 2, 330 - s / 2, s, s); });
    const w = easeOut((lt - 0.35) / 0.8);
    g.save(); g.beginPath(); g.rect(100, 380, 1400 * w + 1, 260); g.clip();
    text('WebSeal', 110, 590, { size: 210, weight: 800, spacing: -7 }); g.restore();
    rule(120, 640, 980 * easeOut((lt - 1.0) / 0.8));
    const a3 = appear(lt, 1.4, 0.6);
    withAlpha(a3, () => text('Is this the code they shipped?', 120, 730 + rise(a3), { size: 56 }));
    const a4 = appear(lt, 2.2, 0.6);
    withAlpha(a4, () => text('Frontend integrity for dApps, anchored on ENS.', 120, 800 + rise(a4), { size: 34, color: C.muted }));
  }, (s) => { cue(s.start + 0.05, 'chime'); cue(s.start + 1.4, 'soft'); });

  add('problem', 8, (lt) => {
    kicker('The problem', 120, 150);
    const k = easeOut((lt - 0.2) / 1.4);
    const a = appear(lt, 0.1, 0.4);
    withAlpha(a, () => text('$' + (1.5 * k).toFixed(1) + 'B', 112, 430, { size: 250, weight: 800, color: C.bad, spacing: -9 }));
    const b = appear(lt, 0.8, 0.6);
    withAlpha(b, () => { text('February 2025', 120, 530 + rise(b), { size: 44, weight: 700 }); wrap('One JavaScript file was changed on Safe{Wallet}\u2019s host. The repo was clean. The contracts were fine.', 120, 590 + rise(b), 820, 52, { size: 38 }); });
    // a site's files; one of them changes
    const cols = 8, rows = 5, cs = 86, gx = 1010, gy = 190;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const i = r * cols + c, a2 = appear(lt, 0.4 + i * 0.025, 0.35);
      const bad = i === 19 && lt > 3.2;
      withAlpha(a2, () => {
        const flash = bad ? 0.5 + 0.5 * Math.sin((lt - 3.2) * 6) : 0;
        box(gx + c * (cs + 12), gy + r * (cs + 12) + rise(a2, 10), cs, cs, { fill: bad ? C.bad : C.cell, stroke: bad ? '#ff6b6b' : C.hatch });
        g.fillStyle = bad ? '#ffffff' : C.hatch;
        for (let l = 0; l < 3; l++) g.fillRect(gx + c * (cs + 12) + 16, gy + r * (cs + 12) + 24 + l * 16 + rise(a2, 10), [50, 36, 44][l], 5);
        if (bad && flash > 0.9) highlightBox(gx + c * (cs + 12), gy + r * (cs + 12), cs, cs, '#ff6b6b', 0.6);
      });
    }
    const c2 = appear(lt, 3.4, 0.5);
    withAlpha(c2, () => kicker('one file changed on the server', gx, gy + rows * (cs + 12) + 40, C.badText));
    rule(120, 760, 1680 * easeOut((lt - 4.2) / 0.8));
    const d = appear(lt, 4.8, 0.6);
    withAlpha(d, () => text('Your wallet signs whatever the page asks for.', 120, 850 + rise(d), { size: 50, color: C.ink }));
  }, (s) => { cue(s.start + 3.2, 'alertSoft'); });

  add('how', 8, (lt) => {
    kicker('How it works', 120, 150);
    const nodes = [
      { x: 120, t: 0.3, k: '01 \u00b7 Release', h: 'CI hashes every file', sub: 'into a manifest' },
      { x: 680, t: 1.6, k: '02 \u00b7 Anchor', h: 'The fingerprint goes on ENS', sub: 'smxreds.eth \u00b7 text record \u201cwebseal\u201d' },
      { x: 1240, t: 2.9, k: '03 \u00b7 Check', h: 'The browser checks every file', sub: 'a mismatch blocks signing' },
    ];
    nodes.forEach((n, i) => {
      const a = backOut((lt - n.t) / 0.6);

/* ---------- frame ---------- */
const FADE_IN = 0.3, FADE_OUT = 0.25;
let FRAME_IMG = null; // the footage frame for the current moment, loaded before drawing
function active(t) {
  const out = [];
  SCENES.forEach((s, i) => {
    const last = i === SCENES.length - 1;
    if (t < s.start || t >= (last ? s.end + 1 : s.end)) return;
    const fin = i === 0 ? 1 : clamp((t - s.start) / FADE_IN), fout = last ? 1 : clamp((s.end - t) / FADE_OUT);
    out.push({ s, a: Math.min(fin, fout) });
  });
  return out;
}
window.drawFrame = async (t) => {
  // load the footage frame this moment needs, before drawing anything
  const cur = active(t).find(({ s }) => s.footage);
  if (cur) {
    const { seq, segs } = cur.s.footage;
    const fr = footageFrame(seq, ftAt(segs, t - cur.s.start));
    const im = await load('/video-assets/footage/' + fr.file);
    FRAME_IMG = im;
  }
  g.setTransform(S, 0, 0, S, 0, 0);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.globalAlpha = 1; g.fillStyle = C.paper; g.fillRect(0, 0, DW, DH);
  for (const { s, a } of active(t)) withAlpha(a, () => s.draw(t - s.start, s.end - s.start));
